
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAK Prayer | 2026 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #fbbf24; --deep-green: #022c22; }
        
        body { 
            background-color: #011a14;
            /* PURE CSS PATTERN: Geometric Diamond Grid */
            background-image:  
                linear-gradient(30deg, #022c22 12%, transparent 12.5%, transparent 87%, #022c22 87.5%, #022c22),
                linear-gradient(150deg, #022c22 12%, transparent 12.5%, transparent 87%, #022c22 87.5%, #022c22),
                linear-gradient(30deg, #022c22 12%, transparent 12.5%, transparent 87%, #022c22 87.5%, #022c22),
                linear-gradient(150deg, #022c22 12%, transparent 12.5%, transparent 87%, #022c22 87.5%, #022c22),
                linear-gradient(60deg, #022c2277 25%, transparent 25.5%, transparent 75%, #022c2277 75.5%, #022c2277),
                linear-gradient(60deg, #022c2277 25%, transparent 25.5%, transparent 75%, #022c2277 75.5%, #022c2277);
            background-size: 80px 140px;
            background-position: 0 0, 0 0, 40px 70px, 40px 70px, 0 0, 40px 70px;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .gold-border { border: 1px solid var(--gold); }
        .arabic { font-family: 'Amiri', serif; }
        
        /* Subtle glow for the next prayer */
        .glow { box-shadow: 0 0 30px rgba(251, 191, 36, 0.15); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h2 class="text-[10px] tracking-[0.5em] text-amber-500 font-black uppercase opacity-80">Ras Al Khaimah</h2>
            <div id="clock" class="text-6xl font-black tracking-tighter my-2">00:00:00</div>
            <p id="hijri" class="arabic text-2xl text-amber-500">Loading Hijri...</p>
        </div>

        <div class="glass-card gold-border glow rounded-[2.5rem] p-8 mb-6 text-center">
            <span class="text-[10px] uppercase tracking-widest opacity-60">Next: <span id="next-name" class="text-white">...</span></span>
            <div id="timer" class="text-5xl font-black text-amber-500 my-2 tabular-nums">00:00:00</div>
            <div class="w-full bg-white/5 h-1 rounded-full overflow-hidden mt-4">
                <div id="progress" class="bg-amber-500 h-full transition-all duration-1000" style="width: 30%"></div>
            </div>
        </div>

        <div id="prayer-list" class="space-y-3">
            </div>

        <div class="text-center mt-8 opacity-30 text-[9px] tracking-[0.3em] uppercase">
            Official UAE Awqaf 2026 Sync
        </div>
    </div>

    <script>
        let times = {};
        async function fetchTimes() {
            const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Ras%20Al%20Khaimah&country=UAE&method=4');
            const data = await res.json();
            times = data.data.timings;
            // Friday Rule 2026
            if(new Date().getDay() === 5) times.Dhuhr = "12:45";
            document.getElementById('hijri').innerText = `${data.data.date.hijri.day} ${data.data.date.hijri.month.ar}`;
            render();
        }

        function render() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB', {hour12:false});
            
            const prayers = [
                {id:'Fajr', ar:'الفجر'}, {id:'Sunrise', ar:'الشروق'}, {id:'Dhuhr', ar:'الظهر'},
                {id:'Asr', ar:'العصر'}, {id:'Maghrib', ar:'المغرب'}, {id:'Isha', ar:'العشاء'}
            ];

            const list = document.getElementById('prayer-list');
            list.innerHTML = "";
            let nextFound = false;

            prayers.forEach(p => {
                const [h,m] = times[p.id].split(':');
                const pDate = new Date(); pDate.setHours(h,m,0);
                const diff = pDate - now;
                const isPast = diff < 0;

                if(!isPast && !nextFound) {
                    nextFound = true;
                    document.getElementById('next-name').innerText = p.id;
                    const s = Math.floor(diff/1000)%60;
                    const min = Math.floor(diff/60000)%60;
                    const hrs = Math.floor(diff/3600000);
                    document.getElementById('timer').innerText = `${String(hrs).padStart(2,'0')}:${String(min).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                }

                list.innerHTML += `
                    <div class="glass-card rounded-2xl p-4 flex justify-between items-center ${!isPast && nextFound ? 'border-amber-500/30' : 'opacity-40'}">
                        <div class="arabic text-2xl font-bold ${!isPast && nextFound ? 'text-amber-500' : ''}">${p.ar}</div>
                        <div class="text-xl font-bold">${h%12||12}:${m} <span class="text-[10px] opacity-40">${h>=12?'PM':'AM'}</span></div>
                    </div>
                `;
            });
        }

        setInterval(render, 1000);
        fetchTimes();
    </script>
</body>
</html>
